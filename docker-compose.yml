services:
  postgres:
    image: postgres:16-alpine
    container_name: property-market-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: property_market_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_market_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: property-market-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/property_market_db?schema=public"
      UPSTASH_REDIS_REST_URL: "${UPSTASH_REDIS_REST_URL:-}"
      UPSTASH_REDIS_REST_TOKEN: "${UPSTASH_REDIS_REST_TOKEN:-}"
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
      args:
        API_BASE_URL: "http://api:3000"
    container_name: property-market-consumer
    restart: always
    ports:
      - "3001:3001"
    environment:
      API_BASE_URL: "http://api:3000"
      PORT: 3001
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
